# Deploy de la demo en Netlify.
# VITE_DEMO_SCOPE define qué se publica (ver frontend/src/app/scope.ts):
#   landing      → solo la landing
#   cliente      → landing + app del cliente, sin solicitar servicios
#   profesional  → landing + cliente y profesional, con solicitudes (vista previa actual)
#   full         → todo: los tres roles, las solicitudes y los controles del presentador

[build]
  base = "frontend"
  # Si falla el lint o algún test no se publica (los e2e de Playwright se corren localmente: pnpm e2e)
  command = "pnpm lint && pnpm test && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.21.0"
  VITE_DEMO_SCOPE = "profesional"

# SPA: cualquier ruta la resuelve React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Es una vista previa privada: que no la indexen los buscadores
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Los assets de Vite llevan hash en el nombre: se pueden cachear para siempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
